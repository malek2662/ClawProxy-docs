<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Routing bootstrap — runs before anything renders.
         1. Legacy hash-router URLs (#/docs?tab=x&anchor=y) are redirected to
            their canonical path equivalents (/docs/x#y).
         2. Deep links that hit GitHub Pages' 404.html are stashed in
            sessionStorage by that page and restored here. */
      (function () {
        try {
          if (location.hash.indexOf('#/') === 0) {
            var legacy = location.hash.slice(1);
            var qi = legacy.indexOf('?');
            var path = qi === -1 ? legacy : legacy.slice(0, qi);
            var query = qi === -1 ? '' : legacy.slice(qi + 1);
            var tab = null;
            var anchor = '';
            query.split('&').forEach(function (pair) {
              var kv = pair.split('=');
              if (kv[0] === 'tab') tab = decodeURIComponent(kv[1] || '');
              if (kv[0] === 'anchor') anchor = '#' + decodeURIComponent(kv[1] || '');
            });
            if (path === '/docs' && tab && tab !== 'quickstart') path = '/docs/' + tab;
            location.replace(path + anchor);
            return;
          }
          var redirect = sessionStorage.getItem('spa-redirect');
          if (redirect) {
            sessionStorage.removeItem('spa-redirect');
            history.replaceState(null, '', redirect);
          }
        } catch (e) { /* routing must never block rendering */ }
      })();
    </script>
